<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Qspiders Requirement Confirmation Form</h1>

    <form action="forms.html" method="get">
        <fieldset>

            <!--autofocus - it's used to make a particular input field as selected by default -->

            <label for="" tabindex="1" accesskey="k" title="Name" contenteditable="true">Name : </label>
            <input type="text" required minlength="4" maxlength="20" name="FullName" value="SRIKANTH K" readonly autofocus>
            <br><br>

            <!-- placeholder - is used to give a temporary hint to the user-->
            <label for="">Password : </label>
            <input type="password" minlength="8" maxlength="16" name="Password" placeholder="Enter Password" required>
            <br><br>

            <label for="">Enter Your Age : </label>
            <input type="number" min="18" max="50" name="age" required>
            <br><br>

            <label for="">E-Mail : </label>
            <input type="email" required>
            <br><br>

            <!--required - it makes the input field as mandatory-->

            <label for="">Mobile Number : </label>
            <input type="tel" maxlength="13" placeholder="Enter Mobile Number" required>
            <br><br>

            <label for="">Gender : </label>
            <select name="Gender">
                <option value=""></option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Others">Others</option>
            </select>
            <br><br>


            <!--selected - it select the particular option by default-->

            <label for="">Prefered Location : </label>
            <select >
                <option value=""></option>
                
                <optgroup label="TamilNadu">
                    <option value="" selected>Chennai</option>
                    <option value="">Coimbature</option>
                    <option value="">Trichy</option>
                </optgroup>
                <optgroup label="Hydrabad">
                    <option value="">Silon</option>
                    <option value="">Mysore</option>
                    <option value="">Noida</option>
                </optgroup>
                <optgroup label="Bengaluru">
                    <option value="">Kunsa</option>
                    <option value="">Kilapur</option>
                    <option value="">Salio</option>
                </optgroup>
            </select>
            <br><br>

            <!-- checked - select the particular input as selected -->

            <label for="">Languages Known : </label>&nbsp;&nbsp;
            <label for="" >Tamil</label>
            <input type="checkbox" checked name="Languages" value="Tamil">
            <label for="">English</label>
            <input type="checkbox" checked name="Languages" value="English">
            <label for="">Hindi</label>
            <input type="checkbox" name="Languages" value="Hindi">
            <label for="">Malaiyalam</label>
            <input type="checkbox" name="Languages"  value="Malaiyalam">
            <br><br>

            <label for="">Eligible To drive : </label>&nbsp;&nbsp;
            <label for="">Yes</label>
            <input type="radio" checked>
            <label for="">No</label>
            <input type="radio">
            <br><br>

            <label for="">Prefered Joining Date :</label>
            <input type="date">
            <br><br>

            <label for="">Check In Time :</label>
            <input type="time">
            <br><br>

            <!--disabled - it doesn't submit the data-->
            <label for="">Expected Salary :</label>
            <input type="number" maxlength="7" value="₹200000" disabled> 
            <br><br>

            <label for="">Mention Precise Details : </label>
            <input type="datetime-local" min="2026-11-01T10:00" max="2026-12-12-01T10:00">
            <br><br>

            <label for="">Check Out Month :</label>
            <input type="month" min="2027-02" max="2027-05">
            <br><br>

            <label for="">Approximate Checkout Week :</label>
            <input type="week">
            <br><br>

            <!--accept - it's used to specify what type of files that the user can select-->


            <!-- multiple - it's used to allows the user can upload multiple file otherwise, only one they can upload-->

            <label for="">Upload your Photo : </label>
            <input type="file" required accept=".jpg,.png" name="Photo" multiple>
            <br><br>

            <label for="">Search for Your Role : </label>
            <input type="search" value="Java FullStack Developer">
            <br><br>

            <label for="">Enter Your LinkedIn Account URL : </label>
            <input type="url" required>
            <br><br>

            <label for="">Choose Your Favourite Color : </label>
            <input type="color">
            <br><br>


            <!--step - it's used to give the specific interval on the slider-->
            <label for="">Select your Favourite Number : </label>
            <input type="range" step="25" min="0" max="100">
            <br><br>

            <input type="submit">
            <input type="reset">
        </fieldset>
    </form>
</body>

</html>
