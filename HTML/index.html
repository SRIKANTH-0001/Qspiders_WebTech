<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    h3{
        background-color: blueviolet;
        height: 30px;
        width: 700px;
    }

    span{
        background-color: rgb(255, 0, 0);
        height: 30px;
        width: 700px;
        font-size: x-large;
    }

    button{
        height: 40px;
        width: 140px;
    }
</style>

<body>

    <!--Elements-->

    <!--Block level Elements-->
        <!--It'll always displayed in the next line only-->
        <h1>Friendly Text Messages!...</h1>
        
        <h3>Friend: Hey!Hi..</h3>
        <h3>Me: Mm.Tell me!What you want?</h3>

    <!--Inline Elements-->
        <!--It'll displayed next to the previous Inline element-->
        <span>Friend: I need ₹100 send me da?</span>
        <span>Me: Wait a minute.I'll Gpay.</span>

        <h3>Friend: Where are you da?</h3>
        <h3>Me: I'm in the Gym!</h3>
        <span>Friend: Ok!Send me the Gym pic.</span>
        <span>Me: Here it is...😊!</span>
        <br>
        <br>

    <!--Inline-block elements -->
        <!--Behave like inline element but,we can change the height and width of the element-->
    
        <img src="gym.webp" alt="" height="300px" width="500px">
        <img src="gym.webp" alt="" height="300px" width="500px">

        <!-- <img> tag is a example to the inline-block element cz,displaying in the same line 
         but i changed the height and width-->

         <!-- One more example is <button> tag-->

        <h3>Me: Choose any button!</h3>
        <button style="background-color: green;">Img Received!</button>
        <button style="background-color: rgb(128, 0, 21);">Img not Received!</button>
</body>
</html>
