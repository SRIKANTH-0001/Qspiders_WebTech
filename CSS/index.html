<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        h2{
            color: blueviolet;
            font-size: x-large;
        }
    </style>
</head>
<body>

    <!-- Implementation of the CSS 
        1.Inline Css
        2.Internal Css
        3.External Css 
    -->
    <center>
        <p style="font-size: xx-large;color: darkmagenta;">Rulers of Tamil Cinema!</p>
    </center>
    <hr>
    <hr>
    <br>
    <!-- 1. Inline Css - styling in the same line using style="" attribute-->
    <h1>Questions for You!!!</h1>
    <h1 style="font-size: x-large;color: rgb(255, 0, 0);">1.Who is Super Star?</h1>
    <h1 style="font-size: x-large;color: rgb(255, 0, 0);">RajiniKanth is a Super star!</h1>
    <hr>

    <!-- 2. Internal css - styling in the same html document using the <style> tag -->
    <h2>2.Who is Thalapathy?</h2>
    <h2>C.Joseph Vijay is Thalapathy!</h2>
    <hr>

    <!-- 3. External Css - styling given in the different Css file connecting that with html using <link> tag -->
     <h3>3.Who is Thala?</h3>
     <h3>Ajith Kumar is called Thala!</h3>
     <hr>
    
</body>
</html>
